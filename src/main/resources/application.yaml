spring:
  application:
    name: z-compliance-review-service
  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: appuser
    password: apppass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: compliance-agent-c
      auto-offset-reset: earliest
    producer:
      acks: all

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.shawn.compliance: DEBUG

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4.1-mini

ollama:
  base-url: http://localhost:11434
  chat-model: gemma4
  embedding-model: nomic-embed-text

pgvector:
  host: localhost
  port: 5432
  database: appdb
  user: appuser
  password: apppass
  table: compliance_embeddings

app:
  kafka:
    topics:
      compliance-requested: wealth.compliance.review.requested
      compliance-completed: wealth.compliance.review.completed

services:
  customer-data:
    base-url: http://localhost:8082