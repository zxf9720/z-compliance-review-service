spring:
  application:
    name: z-compliance-review-service

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.shawn.compliance: DEBUG

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4.1-mini

ollama:
  base-url: http://localhost:11434
  chat-model: gemma4
  embedding-model: nomic-embed-text

pgvector:
  host: localhost
  port: 5432
  database: appdb
  user: appuser
  password: apppass
  table: compliance_embeddings